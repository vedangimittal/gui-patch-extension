<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Remote Deployment</title>
  <style>
    body {
      width: 400px;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
    }
    h2 {
      margin-top: 0;
      color: #333;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
      color: #555;
    }
    input {
      width: 100%;
      padding: 8px;
      border: 1px solid #ddd;
      border-radius: 4px;
      box-sizing: border-box;
      font-size: 14px;
    }
    button {
      width: 100%;
      padding: 10px;
      background: #0066cc;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
    }
    button:hover {
      background: #0052a3;
    }
    button:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
    #status {
      margin-top: 15px;
      padding: 10px;
      border-radius: 4px;
      display: none;
    }
    #status.success {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }
    #status.error {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }
    #status.info {
      background: #d1ecf1;
      color: #0c5460;
      border: 1px solid #bee5eb;
    }
    .note {
      font-size: 12px;
      color: #666;
      margin-top: 10px;
      padding: 10px;
      background: #fff;
      border-radius: 4px;
      border-left: 3px solid #0066cc;
    }
  </style>
</head>
<body>
  <h2>🚀 Remote Deployment</h2>
  
  <div class="form-group">
    <label for="remoteIp">Remote Machine IP:</label>
    <input type="text" id="remoteIp" />
  </div>
  
  <div class="form-group">
    <label for="password">Password:</label>
    <input type="password" id="password" placeholder="Lab password" />
  </div>
  
  <button id="deployBtn">Deploy Build</button>
  
  <div id="status"></div>
  
  <div class="note">
    <strong>Note:</strong> Make sure the native messaging host is installed and the deployment script is configured on your system.
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
